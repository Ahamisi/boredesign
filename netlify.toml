[build]
  command = "npm install && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Ensure native dependencies are built
  SKIP_NATIVE_DEPENDENCIES = "false"
  # Rebuild sharp for Linux platform on Netlify
  npm_config_platform = "linux"
  npm_config_arch = "x64"
  # Use unoptimized images on Netlify (bypasses Sharp issues)
  NEXT_IMAGE_UNOPTIMIZED = "true"

