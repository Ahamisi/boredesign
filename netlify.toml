[build]
  command = "npm install && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Netlify automatically sets NETLIFY=true, which triggers unoptimized images
  # This bypasses Sharp/IPX issues per GitHub discussion #50028
  NETLIFY = "true"
  NEXT_IMAGE_UNOPTIMIZED = "true"

